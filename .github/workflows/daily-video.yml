name: daily-video

on:
  schedule:
    - cron: "0 3 * * *"        # every day 03:00 UTC: renders 3 videos (one per bundle)
  workflow_dispatch:
    inputs:
      episodes:
        description: "space-separated episode ids (empty = today's rotation)"
        default: ""

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}      # TTS voice-over (optional: without it the video is music-only)
      TTS_VOICE: ${{ vars.TTS_VOICE }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg || true
          which google-chrome || which chromium || true
          ffmpeg -version | head -1; node -v
      - name: Render videos
        working-directory: video
        run: |
          IDS="${{ github.event.inputs.episodes }}"
          [ -z "$IDS" ] && IDS="$(python3 pick.py)"
          echo "$IDS" | tr ' ' '\n' > ../ids.txt
          for id in $IDS; do python3 make_video.py "$id"; done
      - name: Publish to a Release and queue for posting
        run: |
          D=$(date -u +%Y-%m-%d)
          TAG="videos-$D-$GITHUB_RUN_NUMBER"
          FILES=""
          while read id; do FILES="$FILES video/out/$id.mp4 video/out/$id.jpg"; done < ids.txt
          gh release create "$TAG" $FILES --title "Videos $D" --notes "Auto-generated cartoon videos for $D" --repo "$GITHUB_REPOSITORY"
          mkdir -p queue
          python3 - "$TAG" "$GITHUB_REPOSITORY" <<'PY'
          import json, sys, datetime
          tag, repo = sys.argv[1], sys.argv[2]
          items = []
          for id in open("ids.txt").read().split():
              m = json.load(open(f"video/out/{id}.json"))
              base = f"https://github.com/{repo}/releases/download/{tag}"
              m.update(video_url=f"{base}/{id}.mp4", poster_url=f"{base}/{id}.jpg")
              items.append(m)
          json.dump({"date": datetime.date.today().isoformat(), "tag": tag, "items": items}, open(f"queue/{tag}.json", "w"), indent=1)
          PY
          git config user.name "promptkit-bot"; git config user.email "bot@users.noreply.github.com"
          git add queue && git commit -m "queue: $TAG" && git push
